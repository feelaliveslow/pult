name: Сборка Pult.exe

# Собирает готовую программу для Windows, которую не нужно устанавливать
# (Python внутри). При публикации тега вида v1.0 файл автоматически
# прикладывается к странице Releases.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "laptop/**"
      - "web/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Сборка
        run: >
          pyinstaller --noconfirm --onefile --console --name Pult
          --icon web/icon-512.png
          --add-data "web;web"
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --collect-all av --collect-all aiortc --collect-all aioice
          laptop/server.py

      - name: Проверка запуска
        shell: pwsh
        run: |
          $env:USERPROFILE = "$env:RUNNER_TEMP\home"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $p = Start-Process dist\Pult.exe -ArgumentList "--no-keep-awake" -PassThru `
                 -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 3; $ok = $r.StatusCode -eq 200 } catch {}
          }
          Get-Content out.txt, err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Pult.exe не ответил на http://127.0.0.1:8765/" }
          (Get-Item dist\Pult.exe).Length / 1MB

      - uses: actions/upload-artifact@v4
        with:
          name: Pult-windows
          path: dist/Pult.exe

      - name: Публикация в Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Pult.exe
